name: Feature request
description: Suggest a focused improvement to the app, curriculum, or contributor workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Learner or contributor problem
      description: What is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps the default experience offline and does not require host filesystem sharing.
          required: true
        - label: I searched for an existing issue covering this request.
          required: true
