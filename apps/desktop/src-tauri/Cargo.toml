[package]
name = "linux-practice-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux Practice Lab desktop application"
default-run = "linux-practice-lab"

[lib]
name = "linux_practice_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared-types = { workspace = true }
vm-manager = { workspace = true }
lesson-engine = { workspace = true }
progress-store = { workspace = true }
runtime-manager = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

[features]
# Enabled by tauri-build for release bundles.
custom-protocol = ["tauri/custom-protocol"]
