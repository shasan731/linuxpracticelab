[Service]
# The base image deliberately ships without host keys. Generating them during every fresh
# lesson boot delays the control agent even though almost no lesson uses SSH, so create each
# installation's unique keys only when ssh.service is actually started.
# Clear the packaged `sshd -t` check so key creation runs before that check, then restore it.
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
