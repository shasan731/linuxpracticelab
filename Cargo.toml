[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/shared-types",
    "crates/vm-manager",
    "crates/lesson-engine",
    "crates/progress-store",
    "crates/runtime-manager",
    "guest/linuxlab-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-2.0-or-later"
repository = "https://github.com/shasan731/linuxpracticelab"
homepage = "https://github.com/shasan731/linuxpracticelab"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "fs"] }
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tempfile = "3"
zstd = "0.13"

shared-types = { path = "crates/shared-types" }
vm-manager = { path = "crates/vm-manager" }
lesson-engine = { path = "crates/lesson-engine" }
progress-store = { path = "crates/progress-store" }
runtime-manager = { path = "crates/runtime-manager" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
